name: provenance-token-preflight

on:
  push:
    branches:
      - ops/publish-historical-r1

permissions:
  contents: write

jobs:
  dry-run-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify token can perform a non-destructive dry-run push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --dry-run origin "HEAD:refs/heads/ops/provenance-token-dry-run"
          echo "PROVENANCE_TOKEN_WRITE_PREFLIGHT=PASS"

      - name: Confirm no publication occurred
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/historical/r1-v1.1 | wc -l)" -eq 0
          echo "HISTORICAL_ARCHIVAL_REF_STILL_ABSENT=YES"
