name: runner-slim-probe-20260829

on:
  push:
    branches:
      - ops/runner-slim-probe-20260829

permissions:
  contents: read

jobs:
  slim:
    runs-on: ubuntu-slim
    steps:
      - name: Prove runner allocation
        shell: bash
        run: |
          set -euo pipefail
          printf 'RUNNER_SLIM_ALLOCATION=PASS\n'
          printf 'RUNNER_OS=%s\n' "$RUNNER_OS"
          printf 'RUNNER_NAME=%s\n' "$RUNNER_NAME"
